{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light" class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Controle de Evasão</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    /* Layout geral */
    html,
    body {
      height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    /* Sidebar e conteúdo com navbar */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      transition: width 0.3s ease;
    }

    .sidebar.collapsed {
      width: 70px;
      padding: 1rem 0.5rem;
    }

    /* Sidebar Brand (logo + title) */
    .sidebar-brand {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
      text-decoration: none;
      color: #0d6efd;
      user-select: none;
      white-space: nowrap;
    }

    .sidebar.collapsed .sidebar-brand span {
      display: none;
    }

    .sidebar-brand i {
      font-size: 1.8rem;
    }

    .sidebar.collapsed .sidebar-brand {
      justify-content: center;
    }

    /* Nav links */
    .sidebar nav a {
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      color: #333;
      text-decoration: none;
      border-radius: 0.375rem;
      margin-bottom: 0.4rem;
      transition: background-color 0.3s ease;
      white-space: nowrap;
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background-color: #0d6efd;
      color: white;
    }

    .sidebar.collapsed nav a span {
      display: none;
    }

    .sidebar.collapsed nav a {
      justify-content: center;
      padding: 0.5rem 0;
    }

    .sidebar nav a i {
      font-size: 1.5rem;
      margin-right: 1rem;
      min-width: 24px;
      text-align: center;
    }

    .sidebar.collapsed nav a i {
      margin-right: 0;
    }

    /* User dropdown */
    .sidebar .dropdown {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid #dee2e6;
    }

    .sidebar .dropdown-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      color: #333;
      text-decoration: none;
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 0.375rem;
      background: none;
      border: none;
    }

    .sidebar .dropdown-toggle:hover {
      background-color: #e7f1ff;
      color: #0d6efd;
    }

    .sidebar.collapsed .dropdown-toggle span {
      display: none;
    }

    .sidebar.collapsed .dropdown-toggle {
      justify-content: center;
      padding: 0.5rem 0;
    }

    .sidebar .dropdown-toggle i {
      font-size: 1.8rem;
      margin-right: 0.5rem;
    }

    .sidebar.collapsed .dropdown-toggle i {
      margin-right: 0;
    }

    /* Navbar superior */
    nav.navbar-top {
      height: 56px;
      background-color: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      flex-shrink: 0;
    }

    nav.navbar-top .navbar-title {
      font-weight: 600;
      font-size: 1.25rem;
      user-select: none;
    }

    /* Conteúdo principal */
    main.content {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background-color: #fff;
    }

    /* Botão toggle sidebar */
    #sidebarToggle {
      background-color: transparent;
      border: none;
      color: white;
      font-size: 1.5rem;
      margin-right: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Botão tema */
    #btnTema {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 1050;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="main-container">
      <aside class="sidebar" id="sidebar">
        <nav>
          <a href="{% url 'courses_list' %}" class="{% if request.resolver_match.url_name == 'courses_list' %}active{% endif %}">
            <i class="bi bi-journal-text"></i>
            <span>Painel de Cursos</span>
          </a>
          {% if user.is_authenticated %}
            <a href="{% url 'new_course' %}" class="{% if request.resolver_match.url_name == 'new_course' %}active{% endif %}">
              <i class="bi bi-plus-square"></i>
              <span>Incluir Curso</span>
            </a>
            <a href="{% url 'register' %}" class="{% if request.resolver_match.url_name == 'register' %}active{% endif %}">
              <i class="bi bi-person-plus"></i>
              <span>Cadastrar Usuário</span>
            </a>
          {% endif %}
        </nav>

        {% if user.is_authenticated %}
          <div class="dropdown">
            <button class="dropdown-toggle" type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i>
              <span>{{ user.username }}</span>
            </button>
            <ul class="dropdown-menu" aria-labelledby="userMenuButton">
              <li><a class="dropdown-item" href="#">Perfil</a></li>
              <li><a class="dropdown-item" href="#">Configurações</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="{% url 'logout' %}">Sair</a></li>
            </ul>
          </div>
        {% else %}
          <div class="mt-auto">
            <a href="{% url 'login' %}" class="btn btn-primary w-100 mb-3">
              <i class="bi bi-box-arrow-in-right"></i>
              Login
            </a>
          </div>
        {% endif %}
      </aside>

      <div style="flex:1; display:flex; flex-direction: column;">
        <nav class="navbar-top">
          <button id="sidebarToggle" title="Alternar menu lateral">
            <i class="bi bi-list"></i>
          </button>
          <div class="navbar-title">Controle de Evasão</div>
        </nav>
        <main class="content">
          {% block content %}
          {% endblock %}
        </main>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.classList.toggle('collapsed');
    });

    // Tema claro/escuro básico
    function alternarTema() {
      if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    }
  </script>
</body>

</html>
