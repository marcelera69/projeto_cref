<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Alunos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
  <div class="container bg-white p-4 rounded shadow">
    <h1 class="mb-4">Painel de Alunos</h1>

    <!-- Campo de busca -->
    <form class="row g-2 mb-4">
      <div class="col-sm-10">
        <input type="text" class="form-control" placeholder="Buscar por nome, email ou matrícula...">
      </div>
      <div class="col-sm-2">
        <button type="submit" class="btn btn-primary w-100">Buscar</button>
      </div>
    </form>

    <!-- Botões de filtros -->
    <div class="row row-cols-1 row-cols-md-3 g-2 mb-4">
      <div class="col"><button class="btn btn-outline-secondary w-100">Total de alunos por curso</button></div>
      <div class="col"><button class="btn btn-outline-secondary w-100">Alunos por grupo</button></div>
      <div class="col"><button class="btn btn-outline-secondary w-100">Alunos em mais de um curso</button></div>
      <div class="col"><button class="btn btn-outline-secondary w-100">Listar alunos por curso</button></div>
      <div class="col"><button class="btn btn-outline-secondary w-100">Alunos por grupo + tutor</button></div>
      <div class="col"><button class="btn btn-outline-secondary w-100">Professores por curso</button></div>
    </div>

    <!-- Tabela de alunos -->
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Matrícula</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>João da Silva</td>
            <td>joao@email.com</td>
            <td>20231234</td>
          </tr>
          <tr>
            <td>Maria Oliveira</td>
            <td>maria@email.com</td>
            <td>20239876</td>
          </tr>
          <tr>
            <td>Carlos Souza</td>
            <td>carlos@email.com</td>
            <td>20238745</td>
          </tr>
          <!-- Mais linhas aqui -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS (opcional, para funcionalidades avançadas) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
