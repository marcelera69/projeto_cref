{% extends 'base.html' %}
{% block title %}Adicionar Alunos{% endblock %}

{% block content %}
<div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
  <h2 class="text-primary mb-4">Adicionar Alunos ao Curso: <strong>{{ course.name }}</strong></h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      {% for student in students %}
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="alunos" value="{{ student.id }}" id="aluno_{{ student.id }}">
          <label class="form-check-label" for="aluno_{{ student.id }}">
            {{ student.name }} - Matrícula: {{ student.registration }}
          </label>
        </div>
      {% empty %}
        <p class="text-muted">Nenhum aluno disponível para matrícula.</p>
      {% endfor %}
    </div>
    <div class="d-flex justify-content-end mt-4">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle"></i> Confirmar Matrícula
      </button>
    </div>
  </form>
</div>
{% endblock %}
