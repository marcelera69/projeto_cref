{% extends 'base.html' %}

{% block content %}
<style>
  body {
    background: #f0f2f5;
  }

  /* Header com título e busca alinhados */
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
    padding: 0 1rem;
  }

  .dashboard-header h1 {
    font-size: 2.8rem;
    font-weight: 900;
    color: #0d6efd;
    margin: 0;
    user-select: none;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  }

  .dashboard-header form {
    max-width: 320px;
    width: 100%;
  }

  .dashboard-header input[type="text"]:focus {
    outline: none;
    border-color: #0d6efd;
    box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
  }

  /* Grid masonry com columns */
  .courses-masonry {
    column-count: 3;
    column-gap: 1.6rem;
    padding: 0 1rem;
  }

  @media (max-width: 935px) {
    .courses-masonry {
      column-count: 2;
    }
    .dashboard-header {
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }
  }

  @media (max-width: 600px) {
    .courses-masonry {
      column-count: 1;
    }
  }

  /* Cards estilo masonry */
  .course-card {
    display: inline-block;
    background: white;
    margin-bottom: 1.6rem;
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
    padding: 1.8rem 1.6rem 2rem;
    text-decoration: none;
    color: #212529;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .course-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(13, 110, 253, 0.3);
  }

  /* Ícone no topo do card */
  .course-card i {
    font-size: 2.8rem;
    color: #0d6efd;
    margin-bottom: 0.8rem;
    user-select: none;
  }

  /* Título do curso */
  .course-card h5 {
    font-weight: 700;
    font-size: 1.25rem;
    margin-bottom: 0.4rem;
  }

  /* Descrição curta */
  .course-card p {
    font-size: 0.95rem;
    color: #495057;
    margin-bottom: 1.2rem;
    line-height: 1.3;
  }

  /* Botão detalhes */
  .course-card .btn-details {
    display: inline-block;
    background: #0d6efd;
    color: white;
    padding: 0.5rem 1.4rem;
    border-radius: 25px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    user-select: none;
    transition: background-color 0.3s ease;
  }

  .course-card .btn-details:hover {
    background-color: #0847b3;
  }

  /* Mensagem caso não tenha cursos */
  .no-courses {
    text-align: center;
    padding: 3rem;
    font-size: 1.3rem;
    color: #6c757d;
  }
</style>

<div class="dashboard-header">
  <h1>📘 Painel de Cursos</h1>
 <form method="get" action="{% url 'courses_list' %}" class="w-100" role="search">
  <div class="input-group">
    <input 
      type="text" 
      name="search" 
      class="form-control rounded-start-pill" 
      placeholder="Buscar por nome do curso..." 
      value="{{ request.GET.search }}"
    >
    <button 
      class="btn btn-primary rounded-end-pill" 
      type="submit" 
      aria-label="Buscar cursos"
    >
      <i class="bi bi-search"></i>
    </button>
  </div>
</form>

</div>

{% if courses %}
<div class="courses-masonry" role="list">
  {% for course in courses %}
  <a href="{% url 'course_detail' course.pk %}" class="course-card" role="listitem" tabindex="0">
    <i class="bi bi-journal-bookmark"></i>
    <h5>{{ course.name }}</h5>
    <p>{{ course.description|default:"Descrição breve do curso." }}</p>
    <span class="btn-details" aria-label="Ver detalhes do curso {{ course.name }}">Detalhes</span>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="no-courses">Nenhum curso encontrado.</div>
{% endif %}

{% endblock %}
