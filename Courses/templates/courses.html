{% extends 'base.html' %}

{% block content %}
  <style>
    /* Adicionado: Efeito hover nos títulos dos cursos */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(37, 37, 37, 0.1);
    }

    .card:hover .card-title {
      color: #3574eb; /* Azul Bootstrap */
    }
  </style>



  <!-- <main class="flex-shrink-0"></main> -->
  <div class="container py-5 bg-body-tertiary shadow-sm rounded-3 border" style="max-width:1100px;">
    
    <div class="text-center mb-5">
      <h1 class="fw-bold text-primary">📚 Painel de Cursos</h1>
      <p class="text-muted">Consulte os cursos disponíveis e filtre por nome</p>
    </div>

    <!-- Campo de busca -->
    <form method="get" action="{% url 'courses_list' %}" class="input-group mb-4 shadow-sm">
      <input type="text" name="search" class="form-control" placeholder="Buscar por nome do curso..." aria-label="Buscar">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-search"></i> Buscar
      </button>
    </form>

    <!-- Lista de cursos -->
    {% if courses %}
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for course in courses %}
        <div class="col">
          <a href="{% url 'course_detail' course.pk %}" class="col text-decoration-none text-body-emphasis" >
            <div class="card h-100 shadow border-0">
              <div class="card-body">
                <h5 class="card-title text-primary">{{ course.name }}</h5>
              </div>
            </div>
          </a>
        </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="alert alert-warning text-center" role="alert">
        Nenhum curso encontrado.
      </div>
    {% endif %}
  </div>

{% endblock %}
