{% extends 'base.html' %}

{% block content %}
<style>
  body {
    background: #f0f2f5;
  }

  /* Header com título e busca alinhados */
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
    padding: 0 1rem;
    margin-left: auto;
    margin-right: auto;
  }

  .dashboard-header h1 {
    font-size: 2.8rem;
    font-weight: 900;
    color: #0d6efd;
    margin: 0;
    user-select: none;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  }

  .dashboard-header form {
    max-width: 320px;
    width: 100%;
  }

  .dashboard-header input[type="text"]:focus {
    outline: none;
    border-color: #0d6efd;
    box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
  }

  /* Grid moderno com CSS Grid */
  .courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
    gap: 1.6rem;
    padding: 0 1rem;
    width: 100%;
    margin: 0 auto;
  }

  .course-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(13, 110, 253, 0.1);
    padding: 1.8rem 1.6rem 2rem;
    text-decoration: none;
    color: #212529;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    min-height: 250px;
    box-sizing: border-box;
  }

  /* Hover */
  .course-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(13, 110, 253, 0.2);
  }

  /* Ícone */
  .course-card i {
    font-size: 3rem;
    color: #0d6efd;
    margin-bottom: 1rem;
    user-select: none;
    align-self: flex-start;
  }

  /* Título com truncamento */
  .course-card h5 {
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 0.6rem;
    max-height: 3rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Descrição truncada */
  .course-card p {
    font-size: 1rem;
    color: #495057;
    line-height: 1.4;
    flex-grow: 1;
    margin-bottom: 1.2rem;
    max-height: 4.2rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }

  /* Botão detalhes */
  .course-card .btn-details {
    align-self: flex-start;
    background: #0d6efd;
    color: white;
    padding: 0.6rem 1.6rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    user-select: none;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 8px rgba(13, 110, 253, 0.15);
  }

  .course-card .btn-details:hover {
    background-color: #0847b3;
    box-shadow: 0 6px 14px rgba(8, 71, 179, 0.3);
  }

  /* Mensagem quando não há cursos */
  .no-courses {
    text-align: center;
    padding: 3rem;
    font-size: 1.3rem;
    color: #6c757d;
  }

/* Responsividade grid */
    @media (max-width: 1100px) {
      .courses-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

  /* Responsividade header */

  @media (max-width: 925px) {
    .dashboard-header {
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }
  }
</style>

<div class="dashboard-header">
  <h1> <a href="{% url 'courses_list' %}" class="text-decoration-none">📘 Painel de Cursos</a></h1>
  <form method="get" action="{% url 'courses_list' %}" class="w-100" role="search">
    <div class="input-group">
      <input 
        type="text" 
        name="search" 
        class="form-control rounded-start-pill" 
        placeholder="Buscar por nome do curso..." 
        value="{{ request.GET.search }}"
      >
      <button 
        class="btn btn-primary rounded-end-pill" 
        type="submit" 
        aria-label="Buscar cursos"
      >
        <i class="bi bi-search"></i>
      </button>
    </div>
  </form>
</div>

<div class="">
  {% if courses %}
  <div class="courses-grid" role="list">
    {% for course in courses %}
    <a href="{% url 'course_modules' course.pk %}" class="course-card" role="listitem" tabindex="0">
      <i class="bi bi-journal-bookmark"></i>
      <h5>{{ course.name }}</h5>
      <p>{{ course.description|default:"Descrição breve do curso." }}</p>
      <span class="btn-details" aria-label="Ver detalhes do curso {{ course.name }}">Detalhes</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="no-courses">Nenhum curso encontrado.</div>
  {% endif %}
</div>
{% endblock %}
