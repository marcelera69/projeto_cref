{% extends 'base.html' %}

{% block content %}
<style>
  .page-layout {
    max-width: 1400px;
    margin: 2rem auto;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: 1fr 2.5fr;
    gap: 2.5rem;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 1.2rem;
  }

  .left-panel h1 {
    font-size: 2.8rem;
    font-weight: 800;
    color: #0d6efd;
    line-height: 1.2;
  }

  .left-panel p {
    color: #6c757d;
    font-size: 1.1rem;
    margin-top: -0.5rem;
  }

  .search-box {
    position: relative;
    margin-top: 1rem;
  }

  .search-box input {
    width: 100%;
    padding: 0.75rem 3rem 0.75rem 1.2rem;
    border-radius: 12px;
    border: 1px solid #ced4da;
    transition: border-color 0.3s ease;
  }

  .search-box input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 10px rgba(13, 110, 253, 0.15);
    outline: none;
  }

  .search-box button {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.2rem;
    color: #0d6efd;
    cursor: pointer;
  }

  .cards-panel {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.6rem;
    align-items: stretch;
  }

  .course-card {
    background: white;
    border-radius: 14px;
    padding: 1.6rem;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    transition: all 0.3s ease;
    text-align: center;
    text-decoration: none;
    color: inherit;
  }

  .course-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 24px rgba(13, 110, 253, 0.15);
  }

  .course-card i {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: #0d6efd;
  }

  .course-card h5 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
    color: #212529;
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    color: #6c757d;
    font-size: 1.2rem;
    padding: 2rem;
  }

  @media (max-width: 900px) {
    .page-layout {
      grid-template-columns: 1fr;
    }

    .left-panel {
      text-align: center;
      align-items: center;
    }

    .search-box {
      width: 100%;
    }
  }
</style>

<div class="page-layout">
  <!-- Painel esquerdo -->
  <div class="left-panel">
    <h1>🎓 Painel de Cursos</h1>
    <p>Encontre e visualize todos os cursos disponíveis na plataforma.</p>
    <form method="get" action="{% url 'courses_list' %}" class="search-box" role="search" aria-label="Buscar cursos">
      <input type="text" name="search" placeholder="Digite o nome do curso..." value="{{ request.GET.search }}">
      <button type="submit" aria-label="Buscar cursos"><i class="bi bi-search"></i></button>
    </form>
  </div>

  <!-- Cards dos cursos -->
  <div class="cards-panel ">
    {% if courses %}
      {% for course in courses %}
        <a href="{% url 'course_detail' course.pk %}" class="course-card border" role="listitem" tabindex="0">
          <i class="bi bi-mortarboard"></i>
          <h5>{{ course.name }}</h5>
        </a>
      {% endfor %}
    {% else %}
      <div class="no-results">Nenhum curso encontrado.</div>
    {% endif %}
  </div>
</div>
{% endblock %}
