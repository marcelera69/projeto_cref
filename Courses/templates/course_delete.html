{% extends "base.html" %}

{% block content %}
  <div class="modal modal-sheet position-static d-block bg-body-secondary p-4 py-md-5" tabindex="-1" role="dialog"
        id="modalSheet">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-bottom-0">
                    <h1 class="modal-title fs-5">Deletar Curso</h1> 
                </div>
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="modal-body py-0">
                        <p>Tem certeza que deseja deletar o curso <strong>{{ object.name }}</strong>?</p>
                    </div>
                    <div class="modal-footer flex-column align-items-stretch w-100 gap-2 pb-3 border-top-0"> 
                        <button type="submit" class="btn btn-lg btn-danger">
                            Confirmar
                        </button> 
                        <a href="{% url 'course_update' object.pk %}" class="btn btn-lg btn-secondary" ata-bs-dismiss="modal">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
