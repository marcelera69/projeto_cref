{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sistema de Evasão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
  body {
    background: linear-gradient(to right, #f8f9fa, #e9ecef);
    transition: background 0.3s ease;
  }

  .login-container {
    max-width: 400px;
    margin: auto;
    padding: 2rem;
    background-color: #fff;
    border-radius: 1rem;
    box-shadow: 0 0 1.5rem rgba(0, 0, 0, 0.1);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  .logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    border-radius: 50%;
    box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.1);
  }

  #btnTema {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 999;
    box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.3);
  }

  /* Tema escuro */
  [data-bs-theme="dark"] body {
    background: linear-gradient(to right, #1c1c1c, #2a2a2a);
  }

  [data-bs-theme="dark"] .login-container {
    background-color: #2b2b2b;
    box-shadow: 0 0 1.5rem rgba(255, 255, 255, 0.05);
    color: #fff;
  }

  [data-bs-theme="dark"] .form-label,
  [data-bs-theme="dark"] small,
  [data-bs-theme="dark"] h2,
  [data-bs-theme="dark"] p {
    color: #eaeaea;
  }

  [data-bs-theme="dark"] .input-group-text {
    background-color: #444;
    color: #fff;
  }
</style>

</head>
<body class="d-flex align-items-center justify-content-center h-100">

  <main class="login-container">
    {% block content %}
    <form method="post" class="needs-validation" novalidate>
      {% csrf_token %}
      <div class="text-center mb-4">
        <img src="https://www.ifpb.edu.br/prpipg/pesquisa/imagens-pesquisa/ifpb.png/@@images/0609b1d7-4a7d-41be-bd18-081ecb35eb9e.png" alt="Logo IFPB" class="logo mb-3">
        <h2 class="h4 fw-bold">Bem-vindo de volta</h2>
        <p class="text-muted">Acesse o sistema com seu usuário</p>
      </div>

      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          {{ form.username }}
        </div>
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          {{ form.password }}
        </div>
      </div>

      <div class="d-grid">
        <button class="btn btn-primary py-2" type="submit">Entrar</button>
      </div>

      <div class="text-center mt-3">
        <small class="text-muted">© 2025 Instituto Federal – Sistema de Controle de Evasão</small>
      </div>
    </form>
    {% endblock %}
  </main>

  <!-- Botão alternar tema -->
  <button id="btnTema" class="btn btn-secondary position-fixed bottom-0 end-0 m-3" onclick="alternarTema()">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="16" fill="currentColor" class="bi bi-moon-stars-fill" viewBox="0 0 16 16">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
            <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/>
        </svg>
    </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function alternarTema() {
      const html = document.documentElement;
      const temaAtual = html.getAttribute("data-bs-theme");
      html.setAttribute("data-bs-theme", temaAtual === "dark" ? "light" : "dark");
    }
  </script>
</body>
</html>
