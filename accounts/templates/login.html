<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela De Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <style>
        html, body{
            height: 100%;
        }

        .form-container{
            margin: auto;
            width: 100%;
            max-width: 350px;
            padding: 1rem;
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary h-100">
    <main class="form-container card">
        {% block content %}
        <form method="post" class="form-signin">
            {% csrf_token %}
            <div class="">
                <img src="https://www.ifpb.edu.br/prpipg/pesquisa/imagens-pesquisa/ifpb.png/@@images/0609b1d7-4a7d-41be-bd18-081ecb35eb9e.png" alt="" class="mb-4" height="40" width="56">
                <h1 class="h3 mb-3 fw-normal">Entre na sua conta</h1>
            </div>
            <table>
                {{ form.as_table}}
            </table>
            <!-- 
            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" placeholder="exemplo@gmail.com">
                <label for="floatingInput">E-mail</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingInput" placeholder="Senha">
                <label for="floatingInput">Senha</label>
            </div>
            <div class="form-check text-start my-3">
                <input type="checkbox" class="form-check-input" id="flexCheckDefault">
                <label for="flexCheckDefault">Lembre de mim</label>
            </div>
             -->
            <input type="submit" value="Entrar" class="btn btn-primary w-100 py-2">
        </form>
        {% endblock %}
    </main>
    <button id="btnTema" class="btn btn-secondary position-fixed bottom-0 end-0 m-3" onclick="alternarTema()">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="16" fill="currentColor" class="bi bi-moon-stars-fill" viewBox="0 0 16 16">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
            <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/>
        </svg>
    </button>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        function alternarTema() {
            const html = document.documentElement;
            const temaAtual = html.getAttribute("data-bs-theme");
            if (temaAtual == "dark") {
                html.setAttribute("data-bs-theme", "light");
            } else {
                html.setAttribute("data-bs-theme", "dark");
            }
            
        }
    </script>
</body>
</html>
