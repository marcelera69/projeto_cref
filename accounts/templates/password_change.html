<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trocar Senha</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
      <h2 class="fw-bold text-primary mt-2">Trocar Senha</h2>
      <p class="text-muted">Defina uma nova senha para sua conta</p>
    </div>

    <!-- Formulário -->
    <form method="post" novalidate>
      {% csrf_token %}
      
      {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
            <small class="form-text text-muted">{{ field.help_text }}</small>
          {% endif %}
          {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i> Alterar Senha
        </button>
      </div>
    </form>

    <!-- Voltar ao login -->
    <div class="text-center mt-3">
      <a href="{% url 'courses_list' %}" class="text-decoration-none">
        <i class="bi bi-arrow-left"></i> Voltar ao Menu
      </a>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
